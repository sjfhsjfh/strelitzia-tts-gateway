[workspace]
resolver = "3"
members = [
    "crates/admin",
    "crates/core",
    "crates/providers",
    "crates/routing",
    "crates/server",
    "crates/store",
]
default-members = ["crates/server"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
askama = "0.16.1"
askama_web = { version = "0.16.0", features = ["axum-0.8"] }
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
bytes = "1.12.1"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
edge-tts-rust = "=0.1.7"
figment = { version = "0.10.19", features = ["env", "toml"] }
futures-util = "0.3.34"
hex = "0.4.3"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["chrono", "json", "macros", "migrate", "runtime-tokio", "sqlite", "uuid"] }
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.8.23"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["catch-panic"] }
tower-sessions = { version = "0.15.0", features = ["signed"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = "6.0.0"
utoipa-axum = "0.3.0"
uuid = { version = "1.28.0", features = ["v7"] }
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
